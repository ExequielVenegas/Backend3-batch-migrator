# Conexion desde contenedores de la futura red Compose local.
# El servicio MySQL del compose debe llamarse mysql.
spring.datasource.url=${BATCH_DB_URL:jdbc:mysql://mysql:3306/lab_batch}
spring.datasource.username=${BATCH_DB_USERNAME}
spring.datasource.password=${BATCH_DB_PASSWORD}
spring.batch.jdbc.initialize-schema=never
