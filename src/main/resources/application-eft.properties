# EFT is opt-in and requires a separate database. Never falls back to lab_batch.
spring.datasource.url=${EFT_BATCH_DB_URL}
spring.datasource.username=${EFT_BATCH_DB_USERNAME}
spring.datasource.password=${EFT_BATCH_DB_PASSWORD}
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:script/eft.sql
spring.batch.job.enabled=false
eft.workers=3
eft.chunk-size=100
