spring.datasource.url=jdbc:h2:mem:batch_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:script/transacciones.sql,classpath:script/calculoInteres.sql,classpath:script/estadocuentaanual.sql
bancoxyz.task-executor.core-pool-size=3
bancoxyz.task-executor.max-pool-size=3
bancoxyz.task-executor.queue-capacity=10
